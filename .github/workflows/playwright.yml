name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      # Map your secure GitHub UI keys into the execution environment
      env:
        BASE_URL: '${{ secrets.PROD_BASE_URL }}'
        SUBSCRIBER_USER_EMAIL: '${{ secrets.SUBSCRIBER_USER_EMAIL }}'
        SUBSCRIBER_USER_NAME: '${{ secrets.SUBSCRIBER_USER_NAME }}'
        SUBSCRIBER_USER_PASSWORD: '${{ secrets.SUBSCRIBER_USER_PASSWORD }}'
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
