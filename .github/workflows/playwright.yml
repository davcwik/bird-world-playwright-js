name: All Playwright Tests

on:
  # This makes the pipeline strictly manual-only
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        type: choice
        options:
          - production
  #        - staging
  # push:
  #   branches: [ main ]
  # pull_request:
  #   branches: [ main ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: self-hosted # tests run via Github self-hosted runner
    #runs-on: ubuntu-latest # tests run via Github.com cloud runner

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Decrypt Environment File
      env:
        ENV_PASSPHRASE: ${{ secrets.ENV_PASSPHRASE }}
        ENV: ${{ inputs.environment }}
      run: |
        gpg --quiet --batch --yes --decrypt --passphrase="$ENV_PASSPHRASE" \
        --output .env.$ENV .env.$ENV.gpg
    
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
